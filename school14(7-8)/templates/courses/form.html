{% extends "base.html" %}

{% block title %}Добавление курса{% endblock %}

{% block content %}

<div class="card p-4 mx-auto" style="max-width: 650px;">

    <h1 class="mb-4">Добавление курса</h1>

    <form method="post" novalidate>

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Сохранить курс
        </button>

        <a href="{% url 'courses:course_list' %}"
           class="btn btn-secondary">
            Отмена
        </a>

    </form>

</div>

{% endblock %}
