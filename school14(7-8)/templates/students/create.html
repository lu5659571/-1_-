{% extends "base.html" %}

{% block title %}Регистрация ученика{% endblock %}

{% block content %}

<div class="card p-4 mx-auto" style="max-width: 650px;">

    <h1 class="mb-4">Регистрация ученика</h1>

    <form method="post" novalidate>

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Зарегистрироваться
        </button>

    </form>

</div>

{% endblock %}
