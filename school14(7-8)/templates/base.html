<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>{% block title %}School14{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background: #f1f5f9;
            color: #243247;
        }

        .navbar {
            background: #24364e;
        }

        .hero {
            background: linear-gradient(120deg, #24364e, #527aab);
            color: white;
            border-radius: 20px;
            padding: 50px 30px;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,.07);
        }

        .course-card {
            transition: transform .2s;
        }

        .course-card:hover {
            transform: translateY(-5px);
        }

        .errorlist {
            color: #b91c1c;
        }

        footer {
            background: #24364e;
            color: white;
        }
    </style>
</head>

<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand fw-bold"
           href="{% url 'core:home' %}">
            <i class="bi bi-mortarboard-fill"></i>
            School14
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbar">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbar">
            <div class="navbar-nav ms-auto">

                <a class="nav-link" href="{% url 'core:home' %}">
                    Главная
                </a>

                <a class="nav-link" href="{% url 'courses:course_list' %}">
                    Курсы
                </a>

                <a class="nav-link" href="{% url 'courses:group_list' %}">
                    Группы
                </a>

                <a class="nav-link" href="{% url 'core:stats' %}">
                    Статистика
                </a>

                <a class="nav-link" href="{% url 'students:student_create' %}">
                    Регистрация
                </a>

            </div>
        </div>
    </div>
</nav>

<main class="container py-5 flex-grow-1">

    {% block content %}
    {% endblock %}

</main>

<footer class="text-center py-4">
    School14 — образовательный центр
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
